name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # The conformance run is the load-bearing check: it replays the golden
      # vector set from conformance/MANIFEST.json and fails on any case that
      # stops matching the specification.
      - name: Conformance vectors
        run: bun conformance/run.ts
